name: Build OS Cast Pro Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macOS
            cmd: npm run electron:build:mac
            artifact: release/*.dmg
          - os: windows-latest
            target: Windows
            cmd: npm run electron:build:win
            artifact: release/*.exe
          - os: ubuntu-latest
            target: Linux
            cmd: npm run electron:build:linux
            artifact: release/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Application
        run: ${{ matrix.cmd }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OS-Cast-Pro-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
